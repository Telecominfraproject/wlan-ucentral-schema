description:
  This section can be used to setup a SSH server on the AP.
type: object
properties:
  port:
    description:
      This option defines which port the SSH server shall be available on.
    type: integer
    maximum: 65535
    default: 22
  authorized-keys:
    description:
      This allows the upload of public ssh keys. Keys need to be seperated by a
      newline.
    type: array
    items:
      type: string
      examples:
      - 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAAAgQC0ghdSd2D2y08TFowZLMZn3x1/Djw3BkNsIeHt/Z+RaXwvfV1NQAnNdaOngMT/3uf5jZtYxhpl+dbZtRhoUPRvKflKBeFHYBqjZVzD3r4ns2Ofm2UpHlbdOpMuy9oeTSCeF0IKZZ6szpkvSirQogeP2fe9KRkzQpiza6YxxaJlWw== user@example'
      - 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ4FDjyCsg+1Mh2C5G7ibR3z0Kw1dU57kfXebLRwS6CL bob@work'
      - 'ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBP/JpJ/KHtKKImzISBDwLO0/EwytIr4pGZQXcP6GCSHchLMyfjf147KNlF9gC+3FibzqKH02EiQspVhRgfuK6y0= alice@home'
  password-authentication:
    description:
      This option defines if password authentication shall be enabled. If set
      to false, only ssh key based authentication is possible.
    type: boolean
    default: true
  idle-timeout:
    description:
      This option defines the idle timeout of an ssh connection, set to 0 to disable
      this feature. Default to 60 seconds if this field is not specified.
    type: integer
    default: 60
    maximum: 600
  connection-rate-limit:
    description:
      This option defines the maximum number of new SSH connections per minute
      that are accepted from a single source address. The limit is enforced by
      the firewall and therefore survives reconnection. Connections above the
      rate are dropped. Set to 0 to disable the guard.
    type: integer
    minimum: 0
    default: 6
  ban-after-failures:
    description:
      This option defines after how many failed SSH authentication attempts
      from one source address within ban-duration minutes that address is
      blocked from the SSH port for ban-duration minutes. A successful login
      clears the count. Dropbear closes a connection after 3 failures, so a
      multiple of 3 is recommended. Set to 0 to disable. Requires the
      ucentral-sshguard package.
    type: integer
    minimum: 0
    default: 9
  ban-duration:
    description:
      This option defines, in minutes, how long a source address stays blocked
      after reaching ban-after-failures, and the window in which failures are
      counted.
    type: integer
    minimum: 1
    maximum: 1440
    default: 10
